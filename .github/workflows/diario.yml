name: Boletín diario
on:
  schedule:
    # 10:00 UTC = 07:00 en Chile con horario de verano (06:00 con horario de invierno).
    # GitHub puede atrasar la ejecución unos minutos.
    - cron: "0 10 * * *"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions
permissions:
  contents: write
concurrency: boletin
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar boletín
        run: python generar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar resultado
        run: |
          git config user.name "boletin-bot"
          git config user.email "boletin-bot@users.noreply.github.com"
          git add docs
