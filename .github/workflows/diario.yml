name: Boletín diario

on:
  schedule:
    # 08:30 UTC = 05:30 AM en Chile (horario de verano UTC-3)
    - cron: "30 8 * * *"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency: boletin

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar boletín
        run: python generar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Guardar resultado
        run: |
          git config user.name "boletin-bot"
          git config user.email "boletin-bot@users.noreply.github.com"
          git add docs
          git commit -m "Boletín $(date -u +%F)" || exit 0
          git push
