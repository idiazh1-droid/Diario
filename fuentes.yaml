# Edita este archivo para cambiar secciones y fuentes. No hace falta tocar el código.
#
# Cada fuente admite:
#   url:       dirección RSS directa (entrega extracto, por lo tanto mejor resumen)
#   dominio:   sitio sin RSS o con RSS roto. Usa Google News filtrado por ese sitio (solo titulares)
#   busqueda:  búsqueda libre en Google News, por ejemplo "litio Chile"
# Si una fuente tiene url y dominio, usa la url y, si falla, recurre al dominio.

ajustes:
  modelo: gemini-2.0-flash
  horas: 36              # antigüedad máxima de una nota
  notas_por_seccion: 6   # tope duro por sección: el boletín siempre termina
  max_por_fuente: 8      # candidatas que se toman de cada fuente
  max_candidatas: 28     # candidatas por sección que se entregan a la IA

secciones:
  - id: chile
    nombre: Chile
    color: "#C8374A"
    criterio: >
      Hechos nacionales de alto impacto: política, economía, seguridad, salud,
      educación, justicia y energía. Excluye farándula, deportes y notas de servicio menores.
    fuentes:
      - nombre: CNN Chile
        dominio: cnnchile.com
      - nombre: BioBioChile
        dominio: biobiochile.cl
      - nombre: La Tercera
        dominio: latercera.com

  - id: mundo
    nombre: Geopolítica
    color: "#2A6FDB"
    criterio: >
      Guerras y conflictos, relaciones entre potencias, diplomacia, sanciones,
      elecciones con impacto internacional, comercio estratégico y energía.
      Excluye crimen local, deportes y farándula.
    fuentes:
      - nombre: DW
        url: https://rss.dw.com/rdf/rss-sp-top
      - nombre: BBC Mundo
        url: https://feeds.bbci.co.uk/mundo/rss.xml
        dominio: bbc.com/mundo
      - nombre: BBC News
        url: https://feeds.bbci.co.uk/news/world/rss.xml
      - nombre: CNN en Español
        dominio: cnnespanol.cnn.com

  - id: ambiente
    nombre: Medioambiente
    color: "#2E9B5F"
    criterio: >
      Cambio climático, biodiversidad, contaminación, áreas protegidas,
      evaluación ambiental, conflictos socioambientales y energía limpia.
      Prioriza Chile y Latinoamérica.
    fuentes:
      - nombre: ONG FIMA
        url: https://www.fima.cl/feed/
        dominio: fima.cl
      - nombre: Mongabay Latam
        url: https://es.mongabay.com/feed/
        dominio: es.mongabay.com
      - nombre: Google News
        busqueda: medio ambiente Chile

  - id: cine
    nombre: Cine
    color: "#C98A12"
    criterio: >
      Estrenos relevantes, festivales, premios, industria y crítica.
      Prioriza cine chileno y latinoamericano. Excluye series de TV y chismes.
    fuentes:
      - nombre: Espinof
        url: https://feeds.weblogssl.com/espinof
        dominio: espinof.com
      - nombre: Variety
        url: https://variety.com/feed/
        dominio: variety.com
      - nombre: IndieWire
        url: https://www.indiewire.com/feed/
        dominio: indiewire.com

  - id: tecnologia
    nombre: Tecnología
    color: "#7A4FD6"
    criterio: >
      Inteligencia artificial, hardware, software, ciberseguridad, regulación
      tecnológica y ciencia aplicada. Excluye ofertas y reseñas menores de consumo.
    fuentes:
      - nombre: Xataka
        url: https://feeds.weblogssl.com/xataka2
        dominio: xataka.com
      - nombre: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
        dominio: arstechnica.com
      - nombre: DW Ciencia y Tecnología
        url: https://rss.dw.com/rdf/rss-sp-cyt
